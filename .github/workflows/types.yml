name: Types match the API

# The model ids and request fields in src/generated.ts come from the live API.
# This checks weekly that they still match; when it fails, run
# `node scripts/generate.mjs`, review the diff, and release.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/generate.mjs --check
